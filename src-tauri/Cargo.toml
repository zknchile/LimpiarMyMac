[package]
name = "cristal"
version = "0.1.1"
description = "Limpieza clara para tu Mac"
authors = ["Cristal"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "cristal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.8"
walkdir = "2"
trash = "5"
plist = "1"
dirs = "5"
rayon = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
