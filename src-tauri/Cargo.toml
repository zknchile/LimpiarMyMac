[package]
name = "cristal"
version = "0.2.2"
description = "Limpieza clara para tu Mac"
authors = ["Cristal"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "cristal_lib"
crate-type = ["rlib"]

[dependencies]
gpui-unofficial = "=1.28.1"
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.28.1", features = ["font-kit"] }
serde = { version = "1", features = ["derive"] }
walkdir = "2"
trash = "5"
plist = "1"
dirs = "5"
rayon = "1"
futures = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
